<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Выбор товара и оформление учебной заявки.">
  <title>Заявка — ShopProject</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#contacts">Обратная связь</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="page__main">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current" aria-current="page">Заявка</span>
    </nav>
    <section class="section">
      <h1>Оформление заявки</h1>
      <p>Выберите товар и укажите контактные данные.</p>
      <form class="order-form" action="#" method="get">
        <div class="order-form__field">
          <label class="order-form__label" for="product">Товар</label>
          <select class="order-form__input" id="product" name="product" required>
            <option value="notebook">Блокнот А5 — 1000 ₽</option>
            <option value="organizer">Органайзер — 1500 ₽</option>
            <option value="lamp">Настольная лампа — 2000 ₽</option>
          </select>
        </div>
        <div class="order-form__field">
          <label class="order-form__label" for="name">Имя</label>
          <input class="order-form__input" id="name" name="name" type="text" minlength="2" required>
        </div>
        <div class="order-form__field">
          <label class="order-form__label" for="email">E-mail</label>
          <input class="order-form__input" id="email" name="email" type="email" required>
        </div>
        <button class="button button--primary" type="submit">Отправить заявку</button>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; 2026 Учебный интернет-магазин</p>
      <p>Фронтенд и бэкенд разработка</p>
    </div>
  </footer>
</body>
</html>
